# ingress-nginx. Add a `tls:` block and a host for production.
# HTTPS pages can only open wss:// sockets, so TLS terminates here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bkny
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: edge, port: { number: 8080 } }
          - path: /play
            pathType: Prefix
            backend:
              service: { name: edge, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: client, port: { number: 8080 } }
