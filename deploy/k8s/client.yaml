apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels: { app: client }
spec:
  replicas: 2
  selector:
    matchLabels: { app: client }
  template:
    metadata:
      labels: { app: client }
    spec:
      containers:
        - name: client
          image: bkny/client
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: client
spec:
  selector: { app: client }
  ports:
    - port: 8080
      targetPort: 8080
