# Full stack without Kubernetes. Open http://localhost:8088
services:
  server:
    build: { context: ., target: server }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7777/healthz').then(r=>process.exit(r.ok?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 5
  edge:
    build: { context: ., target: edge }
    environment:
      BACKEND: static
      GAME_HOST: server
      GAME_PORT: "7777"
      EDGE_SECRET: ${EDGE_SECRET:-local-dev-only}
    depends_on:
      server: { condition: service_healthy }
  client:
    build: { context: ., target: client }
    ports: ["${CLIENT_PORT:-8088}:8080"]
    depends_on: [edge]
